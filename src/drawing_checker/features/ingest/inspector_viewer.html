<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingest Inspector</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --line: #deded9; --text: #1d1d1b; --muted: #6b6b66;
    --accent: #2f6fdb; --hit: #ffd400; --canvas: #e9e9e6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; grid-template-columns: 230px 1fr 300px; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0 8px 0 0; }
  header .file { color: var(--muted); }
  header label { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
  header input[type=search] { width: 200px; }
  button, select, input[type=search] { font: inherit; padding: 3px 8px; border: 1px solid var(--line);
    border-radius: 4px; background: var(--panel); color: var(--text); }
  button:hover { border-color: var(--accent); }
  aside { overflow: auto; background: var(--panel); }
  #pages { border-right: 1px solid var(--line); }
  #side { border-left: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 12px; }
  .pg { padding: 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .pg:hover { background: #f0f4fc; }
  .pg.active { background: #e2ebfb; box-shadow: inset 3px 0 var(--accent); }
  .pg b { font-variant-numeric: tabular-nums; }
  .pg .t { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pg .c { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  main { position: relative; overflow: hidden; background: var(--canvas); cursor: grab; }
  main.drag { cursor: grabbing; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #loading { position: absolute; top: 10px; left: 10px; background: var(--panel); padding: 4px 10px;
    border-radius: 4px; border: 1px solid var(--line); display: none; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
  table.kv { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.kv td { padding: 2px 0; border-bottom: 1px dotted var(--line); }
  table.kv td:last-child { text-align: right; }
  #info { min-height: 110px; background: #fafaf8; border: 1px solid var(--line); border-radius: 4px; padding: 8px;
    word-break: break-word; }
  #info .txt { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  #info .m { color: var(--muted); font-size: 12px; }
  #layerTools { display: flex; gap: 6px; margin-bottom: 6px; }
  #layerTools input { flex: 1; min-width: 0; }
  #layers { max-height: 45vh; overflow: auto; border: 1px solid var(--line); border-radius: 4px; }
  .ly { display: grid; grid-template-columns: 16px 12px 1fr auto; gap: 6px; align-items: center;
    padding: 3px 6px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .ly:hover { background: #f0f4fc; }
  .ly .sw { width: 12px; height: 12px; border-radius: 2px; }
  .ly .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .ly .ct { color: var(--muted); font-variant-numeric: tabular-nums; }
  .ly.solo { background: #fff6cc; }
  #hits { font-size: 12px; color: var(--muted); }
  .hint { color: var(--muted); font-size: 11px; }
  body.wide { grid-template-columns: 480px 1fr 300px; }
  #left { border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
  #left .tabs { display: flex; border-bottom: 1px solid var(--line); }
  #left .tabs button { flex: 1; border: 0; border-radius: 0; padding: 8px; background: var(--panel); cursor: pointer; }
  #left .tabs button.on { box-shadow: inset 0 -2px var(--accent); font-weight: 600; }
  #pages, #checks, #dossier { overflow: auto; flex: 1; }
  #pages { border-right: 0; }
  #checks, #dossier { padding: 8px 10px; }
  #dossier h3 { font-size: 13px; margin: 12px 0 4px; }
  #dossier table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #dossier td, #dossier th { padding: 3px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  #dossier th { color: var(--muted); font-weight: 600; }
  #dossier .sh { cursor: pointer; } #dossier .sh:hover { background: #f0f0ec; }
  #dossier .vw { color: var(--muted); font-size: 11px; } #dossier .vw span { cursor: pointer; text-decoration: underline dotted; }
  .sum { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chip { padding: 2px 8px; border-radius: 10px; font-size: 12px; border: 1px solid var(--line); background: #fafaf8; }
  .cov { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .res { border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-bottom: 8px; background: #fff; }
  .res .hd { display: flex; gap: 8px; align-items: baseline; }
  .res .cd { font-weight: 600; }
  .res .tt { color: var(--muted); font-size: 12px; }
  .res .ln { margin: 4px 0; }
  .res .kv2 { font-size: 12px; font-variant-numeric: tabular-nums; }
  .res .why { font-size: 12px; color: #3a3a37; margin-top: 4px; }
  .res .ev { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .res .ev button { font-size: 11px; padding: 1px 6px; }
  .res .rv { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); font-size: 12px; }
  .res .rv button, .res .rv select, .res .rv input { font-size: 11px; padding: 1px 6px; }
  .res .rv input { flex: 1; min-width: 120px; }
  .res .rv .done { color: #2e7d32; font-weight: 600; }
  .res .rv .done.bad { color: #c62828; }
  .res.reviewed { border-left: 3px solid #2e7d32; }
  .res.reviewed.bad { border-left-color: #c62828; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; color: #fff; white-space: nowrap; }
  .s-pass { background: #1a7f37; } .s-fail { background: #c62828; } .s-warning { background: #b26a00; }
  .s-pending { background: #6b4fbb; } .s-unknown { background: #8a8a85; } .s-unsupported { background: #c4c4bf; color: #1d1d1b; }
</style>
</head>
<body>
<header>
  <h1><a href="../index.html" title="Danh sách lần chạy" style="color:inherit;text-decoration:none">◂</a> Ingest Inspector</h1><span class="file" id="file"></span>
  <button id="prev" title="Trang trước (←)">◀</button>
  <select id="pageSel"></select>
  <button id="next" title="Trang sau (→)">▶</button>
  <button id="fit" title="Vừa khung (F)">Vừa khung</button>
  <label><input type="checkbox" id="showBg" checked> Ảnh nền</label>
  <label><input type="checkbox" id="showText" checked> Khung chữ</label>
  <label><input type="checkbox" id="showStroke" checked> Nét</label>
  <label><input type="checkbox" id="showFill" checked> Vùng tô</label>
  <label>Màu <select id="colorMode"><option value="layer">theo layer</option><option value="flat">một màu</option></select></label>
  <label>Mờ nền <input type="range" id="bgAlpha" min="0" max="100" value="45"></label>
  <input type="search" id="search" placeholder="Tìm chữ… (Enter: kế tiếp)">
  <span id="hits"></span>
</header>

<aside id="left">
  <div class="tabs"><button data-tab="pages" class="on">Trang</button><button data-tab="dossier" id="dossierTab">Hồ sơ</button><button data-tab="checks" id="checksTab">Kiểm tra</button></div>
  <div id="pages"></div>
  <div id="dossier" hidden><span class="hint">Chưa có mục lục hồ sơ cho lần chạy này.</span></div>
  <div id="checks" hidden><span class="hint">Chưa có kết quả kiểm tra cho lần chạy này.</span></div>
</aside>

<main id="stage">
  <canvas id="cv"></canvas>
  <div id="loading">Đang nạp…</div>
</main>

<aside id="side">
  <section>
    <h2>Chữ dưới con trỏ</h2>
    <div id="info"><span class="m">Rê chuột lên khung chữ. Lăn chuột: zoom · kéo: di chuyển · F: vừa khung.</span></div>
  </section>
  <section>
    <h2>Thống kê trang</h2>
    <table class="kv" id="stats"></table>
  </section>
  <section>
    <h2>Layer CAD</h2>
    <div id="layerTools">
      <input type="search" id="layerFilter" placeholder="Lọc layer…">
      <button id="allOn" title="Bật tất cả">Tất cả</button>
      <button id="allOff" title="Tắt tất cả">Không</button>
    </div>
    <div id="layers"></div>
    <div class="hint">Bấm tên layer để tô nổi (solo), bấm lại để bỏ. Số: chữ / nét.</div>
  </section>
</aside>

<script>
const META = /*__META__*/null;
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");

const state = {
  page: null, img: null, view: { s: 1, x: 0, y: 0 },
  hidden: new Set(), solo: null, hover: null, hits: [], hitIdx: -1,
  layerPaths: [], layerText: [],
  evidence: [], checks: null,
};
const cache = new Map();
const pending = new Map();

// ---- dữ liệu trang (file pNNN.js gọi window.__ingestPage) ----
window.__ingestPage = (data) => { cache.set(data.n, data); pending.get(data.n)?.(data); pending.delete(data.n); };
const pad = (n) => String(n).padStart(3, "0");

function loadPage(n) {
  if (cache.has(n)) return Promise.resolve(cache.get(n));
  return new Promise((resolve, reject) => {
    pending.set(n, resolve);
    const s = document.createElement("script");
    s.src = `p${pad(n)}.js`;
    s.onerror = () => reject(new Error("Không nạp được " + s.src));
    document.head.appendChild(s);
  });
}

function layerColor(i, name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `hsl(${h % 360} 75% 42%)`;
}

function buildGeometry(p) {
  state.layerPaths = p.layers.map(() => ({ s: null, f: null, n: 0 }));
  state.layerText = p.layers.map(() => ({ path: new Path2D(), n: 0 }));
  for (const [key, g] of Object.entries(p.paths)) {
    const lp = state.layerPaths[+key];
    const stroke = new Path2D(), fill = new Path2D();
    for (const arr of g.s) addPoly(stroke, arr, false);
    for (const arr of g.c) addPoly(stroke, arr, true);
    for (const arr of g.f) addPoly(fill, arr, true);
    lp.s = stroke; lp.f = g.f.length ? fill : null;
    lp.n = g.s.length + g.c.length + g.f.length;
  }
  for (const t of p.texts) {
    const lt = state.layerText[t[8]];
    lt.path.rect(t[0], t[1], t[2] - t[0], t[3] - t[1]); lt.n++;
  }
}
function addPoly(path, a, close) {
  path.moveTo(a[0], a[1]);
  for (let i = 2; i < a.length; i += 2) path.lineTo(a[i], a[i + 1]);
  if (close) path.closePath();
}

async function showPage(n, focus = null) {
  state.want = n;
  $("loading").style.display = "block";
  try {
    const p = await loadPage(n);
    if (state.want !== n) return;  // người dùng đã chuyển sang trang khác
    state.page = p; state.hover = null; state.solo = null;
    buildGeometry(p);
    state.img = null;
    if (META.dpi > 0) {
      const img = new Image();
      img.onload = () => { state.img = img; draw(); };
      img.src = `p${pad(n)}.jpg`;
    }
    $("pageSel").value = n;
    document.querySelectorAll(".pg").forEach((el) => el.classList.toggle("active", +el.dataset.n === n));
    document.querySelector(`.pg[data-n="${n}"]`)?.scrollIntoView({ block: "nearest" });
    state.evidence = focus || [];
    renderStats(p); renderLayers(); runSearch(); fit();
    if (focus && focus.length) zoomTo(focus);
    try { localStorage.setItem("ingest.page." + META.runId, n); } catch (e) {}
    updateHash();
  } catch (e) {
    alert(e.message);
  } finally {
    $("loading").style.display = "none";
  }
}

// ---- vẽ ----
function resize() {
  const r = stage.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  if (state.autoFit) fit(); else draw();
}
function fit() {
  const p = state.page; if (!p) return;
  const r = stage.getBoundingClientRect(), m = 20;
  const s = Math.min((r.width - 2 * m) / p.w, (r.height - 2 * m) / p.h);
  state.view = { s, x: (r.width - p.w * s) / 2, y: (r.height - p.h * s) / 2 };
  state.autoFit = true;
  draw();
}
function zoomTo(boxes) {
  const r = stage.getBoundingClientRect();
  const x0 = Math.min(...boxes.map((b) => b[0])), y0 = Math.min(...boxes.map((b) => b[1]));
  const x1 = Math.max(...boxes.map((b) => b[2])), y1 = Math.max(...boxes.map((b) => b[3]));
  const pad = 60, s = Math.min(Math.max(Math.min((r.width - 2 * pad) / Math.max(x1 - x0, 1), (r.height - 2 * pad) / Math.max(y1 - y0, 1)), 0.5), 8);
  state.view = { s, x: r.width / 2 - ((x0 + x1) / 2) * s, y: r.height / 2 - ((y0 + y1) / 2) * s };
  state.autoFit = false; draw();
}
let raf = 0;
function draw() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(); }); }

function paint() {
  const p = state.page, dpr = window.devicePixelRatio || 1, v = state.view;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!p) return;
  ctx.setTransform(v.s * dpr, 0, 0, v.s * dpr, v.x * dpr, v.y * dpr);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, p.w, p.h);

  if ($("showBg").checked && state.img) {
    ctx.globalAlpha = 1 - $("bgAlpha").value / 100;
    ctx.drawImage(state.img, 0, 0, p.w, p.h);
    ctx.globalAlpha = 1;
  }
  const hair = 1 / v.s, flat = $("colorMode").value === "flat";
  const visible = (i) => !state.hidden.has(i) && (state.solo === null || state.solo === i);

  state.layerPaths.forEach((lp, i) => {
    if (!lp.n || !visible(i)) return;
    const color = flat ? "#1d1d1b" : layerColor(i, p.layers[i]);
    if (lp.f && $("showFill").checked) { ctx.fillStyle = color; ctx.globalAlpha = 0.35; ctx.fill(lp.f); ctx.globalAlpha = 1; }
    if (lp.s && $("showStroke").checked) { ctx.strokeStyle = color; ctx.lineWidth = hair; ctx.stroke(lp.s); }
  });
  if ($("showText").checked) {
    ctx.lineWidth = 1.5 * hair;
    state.layerText.forEach((lt, i) => {
      if (!lt.n || !visible(i)) return;
      ctx.strokeStyle = flat ? "#2f6fdb" : layerColor(i, p.layers[i]);
      ctx.stroke(lt.path);
    });
  }
  // kết quả tìm kiếm + chữ đang trỏ
  ctx.fillStyle = "rgba(255,212,0,.45)";
  for (const i of state.hits) { const t = p.texts[i]; ctx.fillRect(t[0], t[1], t[2] - t[0], t[3] - t[1]); }
  if (state.hitIdx >= 0) outline(p.texts[state.hits[state.hitIdx]], "#e0000f", 3 * hair);
  if (state.hover !== null) outline(p.texts[state.hover], "#e0000f", 2 * hair);
  // bằng chứng của kết quả kiểm tra đang chọn
  for (const b of state.evidence) {
    const m = 4 / v.s;
    ctx.fillStyle = "rgba(255,90,0,.18)"; ctx.fillRect(b[0] - m, b[1] - m, b[2] - b[0] + 2 * m, b[3] - b[1] + 2 * m);
    ctx.strokeStyle = "#ff5a00"; ctx.lineWidth = 2.5 * hair;
    ctx.strokeRect(b[0] - m, b[1] - m, b[2] - b[0] + 2 * m, b[3] - b[1] + 2 * m);
  }
}
function outline(t, color, w) {
  ctx.strokeStyle = color; ctx.lineWidth = w;
  const m = 2 / state.view.s;
  ctx.strokeRect(t[0] - m, t[1] - m, t[2] - t[0] + 2 * m, t[3] - t[1] + 2 * m);
}

// ---- tương tác ----
const toPage = (e) => {
  const r = stage.getBoundingClientRect(), v = state.view;
  return [(e.clientX - r.left - v.x) / v.s, (e.clientY - r.top - v.y) / v.s];
};
stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect(), v = state.view;
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.exp(-e.deltaY * 0.0015), s = Math.min(Math.max(v.s * k, 0.05), 200);
  state.view = { s, x: mx - (mx - v.x) * (s / v.s), y: my - (my - v.y) * (s / v.s) };
  state.autoFit = false;
  draw();
}, { passive: false });

let drag = null;
stage.addEventListener("mousedown", (e) => { drag = { x: e.clientX, y: e.clientY, vx: state.view.x, vy: state.view.y }; stage.classList.add("drag"); });
window.addEventListener("mouseup", () => { drag = null; stage.classList.remove("drag"); });
window.addEventListener("mousemove", (e) => {
  if (drag) {
    state.view.x = drag.vx + e.clientX - drag.x; state.view.y = drag.vy + e.clientY - drag.y;
    state.autoFit = false; draw(); return;
  }
  if (!state.page || e.target !== cv) return;
  const [x, y] = toPage(e), p = state.page, tol = 2 / state.view.s;
  let best = null, area = Infinity;
  p.texts.forEach((t, i) => {
    if (state.hidden.has(t[8]) || (state.solo !== null && state.solo !== t[8])) return;
    if (x >= t[0] - tol && x <= t[2] + tol && y >= t[1] - tol && y <= t[3] + tol) {
      const a = (t[2] - t[0]) * (t[3] - t[1]); if (a < area) { area = a; best = i; }
    }
  });
  if (best !== state.hover) { state.hover = best; renderInfo(best, x, y); draw(); }
  else if (best === null) renderInfo(null, x, y);
});
stage.addEventListener("dblclick", fit);

function renderInfo(i, x, y) {
  const p = state.page, pos = `x ${x.toFixed(1)} · y ${y.toFixed(1)} pt`;
  if (i === null) { $("info").innerHTML = `<span class="m">${pos}</span>`; return; }
  const t = p.texts[i];
  $("info").innerHTML = `<div class="txt"></div>
    <div class="m">Font: ${esc(p.fonts[t[5]])} · cỡ ${t[6]} · xoay ${t[7]}°</div>
    <div class="m">Layer: ${esc(p.layers[t[8]])}</div>
    <div class="m">Khung: (${t[0]}, ${t[1]}) → (${t[2]}, ${t[3]})</div>
    <div class="m">${pos}</div>`;
  $("info").querySelector(".txt").textContent = t[4];
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderStats(p) {
  const s = p.stats, rows = [
    ["Khổ trang (pt)", `${p.w} × ${p.h}`], ["Xoay trang", p.rotation + "°"],
    ["Khối chữ", s.texts], ["Ký tự (không khoảng trắng)", s.chars],
    ["Nét vẽ", s.paths], ["Điểm", s.points], ["Nét kín", s.closed], ["Vùng tô", s.filled], ["Nét đứt", s.dashed],
    ["Số layer", s.layers], ["Thời gian trích chữ", s.textMs + " ms"], ["Thời gian trích nét", s.pathsMs + " ms"],
    ["Góc xoay chữ", Object.entries(s.rotations).map(([k, v]) => `${k}°:${v}`).join(" ")],
  ];
  $("stats").innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${typeof v === "number" ? v.toLocaleString("vi-VN") : esc(v)}</td></tr>`).join("");
}

function renderLayers() {
  const p = state.page, q = $("layerFilter").value.trim().toLowerCase();
  const textCount = state.layerText.map((l) => l.n);
  const order = p.layers.map((_, i) => i)
    .sort((a, b) => (state.layerPaths[b].n + textCount[b]) - (state.layerPaths[a].n + textCount[a]));
  $("layers").innerHTML = order.filter((i) => !q || p.layers[i].toLowerCase().includes(q)).map((i) => `
    <div class="ly${state.solo === i ? " solo" : ""}" data-i="${i}">
      <input type="checkbox" ${state.hidden.has(i) ? "" : "checked"}>
      <span class="sw" style="background:${layerColor(i, p.layers[i])}"></span>
      <span class="nm" title="${esc(p.layers[i])}">${esc(p.layers[i])}</span>
      <span class="ct">${textCount[i]} / ${state.layerPaths[i].n.toLocaleString("vi-VN")}</span>
    </div>`).join("");
}
$("layers").addEventListener("change", (e) => {
  const i = +e.target.closest(".ly").dataset.i;
  e.target.checked ? state.hidden.delete(i) : state.hidden.add(i); draw();
});
$("layers").addEventListener("click", (e) => {
  if (!e.target.classList.contains("nm")) return;
  const i = +e.target.closest(".ly").dataset.i;
  state.solo = state.solo === i ? null : i; renderLayers(); draw();
});
$("layerFilter").addEventListener("input", renderLayers);
$("allOn").onclick = () => { state.hidden.clear(); state.solo = null; renderLayers(); draw(); };
$("allOff").onclick = () => { state.page.layers.forEach((_, i) => state.hidden.add(i)); state.solo = null; renderLayers(); draw(); };

function runSearch() {
  const q = $("search").value.trim().toLowerCase(), p = state.page;
  state.hits = q && p ? p.texts.map((t, i) => [t, i]).filter(([t]) => t[4].toLowerCase().includes(q)).map(([, i]) => i) : [];
  state.hitIdx = -1;
  $("hits").textContent = q ? `${state.hits.length} kết quả` : "";
  draw();
}
$("search").addEventListener("input", runSearch);
$("search").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !state.hits.length) return;
  state.hitIdx = (state.hitIdx + 1) % state.hits.length;
  const t = state.page.texts[state.hits[state.hitIdx]], r = stage.getBoundingClientRect();
  const s = Math.max(state.view.s, 4);
  state.view = { s, x: r.width / 2 - ((t[0] + t[2]) / 2) * s, y: r.height / 2 - ((t[1] + t[3]) / 2) * s };
  state.autoFit = false;
  $("hits").textContent = `${state.hitIdx + 1}/${state.hits.length}`;
  draw();
});

["showBg", "showText", "showStroke", "showFill", "colorMode", "bgAlpha"].forEach((id) => $(id).addEventListener("input", draw));
$("fit").onclick = fit;
const step = (d) => {
  const list = META.pages.map((x) => x.n), i = list.indexOf(state.page?.n);
  const n = list[Math.min(Math.max(i + d, 0), list.length - 1)]; if (n !== state.page?.n) showPage(n);
};
$("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
$("pageSel").onchange = (e) => showPage(+e.target.value);
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1);
  else if (e.key === "f" || e.key === "F") fit();
});

// ---- tab Kiểm tra ----
// Bốn trạng thái của checklist (đối tác): Đạt / Không đạt / Cảnh báo / Cần kiểm tra — "Cần kiểm tra" ghi rõ vì sao.
const STATUS_VI = { pass: "Đạt", fail: "Không đạt", warning: "Cảnh báo", pending: "Cần kiểm tra", unknown: "Cần kiểm tra · không thấy dữ liệu", unsupported: "Cần kiểm tra · chưa tự kiểm" };
document.querySelectorAll("#left .tabs button").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
function setTab(tab) {
  document.querySelectorAll("#left .tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  $("pages").hidden = tab !== "pages"; $("checks").hidden = tab !== "checks"; $("dossier").hidden = tab !== "dossier";
  document.body.classList.toggle("wide", tab === "checks" || tab === "dossier");
  state.tab = tab; updateHash();
}
function updateHash() {
  const parts = [];
  if (state.page) parts.push("p=" + state.page.n);
  if (state.tab === "checks" || state.tab === "dossier") parts.push("tab=" + state.tab);
  history.replaceState(null, "", "#" + parts.join("&"));
}
// ---- duyệt kết quả: Đúng / Sai vị trí / Sai → đáp án đúng; lưu qua MAIN vào data/reviews/<hồ sơ>.jsonl ----
const OUTCOME_VI = { pass: "Đạt", fail: "Không đạt", warning: "Cảnh báo", pending: "Cần kiểm tra", "n/a": "Không áp dụng", unknown: "Không kết luận" };
const EXPECTED = ["pass", "fail", "warning", "pending", "n/a"];
state.reviews = {};
let blind = false;
try { blind = localStorage.getItem("ingest.blind") === "1"; } catch (e) {}
const rvKey = (r) => r.ruleId + "#" + r.line;
async function loadReviews() {
  const c = state.checks; if (!c || !c.dossier) return;
  try {
    const res = await fetch("/debug/reviews/" + c.dossier);
    if (res.ok) (await res.json()).forEach((v) => { state.reviews[v.ruleId + "#" + v.lineIndex] = v; });
    state.reviewApi = res.ok;
  } catch (e) { state.reviewApi = false; }
  renderChecks();
}
async function saveReview(r, verdict, expected, note) {
  const body = { ruleId: r.ruleId, code: r.code, lineIndex: r.line, lineText: r.lineText, verdict, expected,
    predicted: r.outcome, note: note || null, runId: META.runId, model: r.ai?.model ?? null,
    promptVersion: r.ai?.promptVersion ?? null, callId: r.ai?.callId ?? null, blind };
  let res;
  try {
    res = await fetch("/debug/reviews/" + state.checks.dossier, { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  } catch (e) { res = { ok: false, status: "mạng" }; }
  if (!res.ok) { alert("Không lưu được kết quả duyệt (" + res.status + "). MAIN có đang chạy không?"); return; }
  state.reviews[rvKey(r)] = await res.json();
  renderChecks();
}
function reviewBar(r, idx) {
  if (!state.checks.dossier || !r.ruleId) return "";
  if (state.reviewApi === false) return `<div class="rv hint">Mở viewer qua MAIN (http://localhost:8000/debug/inspect/…) để duyệt.</div>`;
  const v = state.reviews[rvKey(r)];
  const label = v && (v.verdict === "correct" ? "Đúng" : v.verdict === "wrong-location" ? "Đúng, sai vị trí" : "Sai → " + OUTCOME_VI[v.expected]);
  const done = v ? `<span class="done ${v.expected !== r.outcome ? "bad" : ""}">✔ ${label}</span>` : "";
  const note = `<input data-note="${idx}" placeholder="ghi chú (tùy chọn)" value="${esc(v?.note ?? "")}">`;
  if (blind && !v) {
    return `<div class="rv">Kết luận đúng: ${EXPECTED.map((o) => `<button data-blind="${idx}" data-o="${o}">${OUTCOME_VI[o]}</button>`).join("")}${note}</div>`;
  }
  return `<div class="rv">${done}
    <button data-ok="${idx}">Đúng</button><button data-loc="${idx}">Sai vị trí</button>
    Sai → <select data-wrong="${idx}"><option value="">chọn kết luận đúng…</option>
      ${EXPECTED.filter((o) => o !== r.outcome).map((o) => `<option value="${o}">${OUTCOME_VI[o]}</option>`).join("")}</select>
    ${note}</div>`;
}
window.__ingestChecks = (data) => { state.checks = data; renderChecks(); loadReviews(); };
function statusOf(r) { return r.supported ? r.status : "unsupported"; }
function renderChecks() {
  const c = state.checks; if (!c) return;
  const rows = c.rows, cov = c.coverage;
  const counts = {}; rows.forEach((r) => { const k = statusOf(r); counts[k] = (counts[k] || 0) + 1; });
  $("checksTab").textContent = `Kiểm tra (${(counts.pass || 0)}✓ ${(counts.fail || 0)}✗)`;
  const filter = $("checks").querySelector("label.hint select")?.value || "checked";
  const reviewed = rows.filter((r) => state.reviews[rvKey(r)]);
  const shown = rows.filter((r) => filter === "all" || (filter === "checked" ? r.supported
    : filter === "unreviewed" ? !state.reviews[rvKey(r)] : statusOf(r) === filter));
  const order = { fail: 0, warning: 1, pending: 2, pass: 3, unknown: 4, unsupported: 5 };
  shown.sort((a, b) => order[statusOf(a)] - order[statusOf(b)]);
  $("checks").innerHTML = `
    <div class="sum">${Object.keys(order).filter((k) => counts[k]).map((k) => `<span class="chip"><span class="badge s-${k}">${counts[k]}</span> ${STATUS_VI[k]}</span>`).join("")}</div>
    <div class="cov">Nguồn rule: ${esc(c.source)} · loại nhà ${esc(c.houseType)} · nhóm ${esc(c.categories.join(", "))}<br>
      ${cov.rulesApplicable}/${cov.rulesTotal} rule áp dụng · ${cov.linesSupported}/${cov.linesApplicable} dòng tiêu chí có checker ·
      thực thể: ${Object.entries(c.entities).map(([k, v]) => `${k} ${v}`).join(", ") || "—"}
      ${cov.ai ? `<br>AI: ${cov.ai.lines} dòng · ${cov.ai.calls} lần gọi · ${cov.ai.usd} USD${cov.ai.errors ? ` · ${cov.ai.errors} lỗi` : ""}${cov.ai.stopped ? ` · <b>${esc(cov.ai.stopped)}</b>` : ""}` : ""}</div>
    ${c.dossier ? `<div class="cov">Đã duyệt ${reviewed.length}/${rows.length} dòng · hệ thống đúng ${reviewed.filter((r) => state.reviews[rvKey(r)].expected === r.outcome).length} ·
      <label><input type="checkbox" id="blindBox" ${blind ? "checked" : ""}> Chấm mù (ẩn kết luận của hệ thống tới khi chấm xong dòng)</label></div>` : ""}
    <label class="hint">Hiện <select>
      ${[["checked", "Đã kiểm (có checker)"], ["all", "Tất cả dòng"], ...(c.dossier ? [["unreviewed", "Chưa duyệt"]] : []), ...Object.keys(order).map((k) => [k, STATUS_VI[k]])]
        .map(([v, t]) => `<option value="${v}" ${v === filter ? "selected" : ""}>${t}</option>`).join("")}
    </select></label>
    ${shown.map((r, i) => resultCard(r, rows.indexOf(r))).join("") || '<p class="hint">Không có dòng nào.</p>'}`;
  $("checks").querySelector("label.hint select").onchange = renderChecks;
  const bb = $("blindBox");
  if (bb) bb.onchange = () => { blind = bb.checked; try { localStorage.setItem("ingest.blind", blind ? "1" : "0"); } catch (e) {} renderChecks(); };
}
function resultCard(r, idx) {
  const st = statusOf(r);
  const pages = {};
  r.evidence.forEach((e) => { (pages[e.page] = pages[e.page] || []).push(e.bbox); });
  const v = state.reviews[rvKey(r)];
  const hide = blind && !v && state.checks.dossier;  // chấm mù: chưa chấm thì không lộ kết luận của hệ thống
  return `<div class="res ${v ? "reviewed" : ""} ${v && v.expected !== r.outcome ? "bad" : ""}">
    <div class="hd">${hide ? "" : `<span class="badge s-${st}">${r.outcome === "n/a" ? "Không áp dụng" : STATUS_VI[st]}</span>`}<span class="cd">${esc(r.code)}</span>
      <span class="tt">${esc([...r.headings, r.title].filter(Boolean).join(" › "))}</span></div>
    <div class="ln">${esc(r.lineText)}</div>
    ${r.supported && !hide ? `<div class="kv2">Trích: <b>${esc(r.extracted ?? "—")}</b> · Chuẩn: <b>${esc(r.standard ?? "—")}</b> · tin cậy ${r.confidence.toFixed(2)}</div>` : ""}
    ${hide ? "" : `<div class="why">${esc(r.reason)}</div>`}
    ${Object.keys(pages).length ? `<div class="ev">${Object.entries(pages).map(([pg, boxes]) =>
      `<button data-r="${idx}" data-p="${pg}" title="Xem bằng chứng trên trang ${pg}">tr.${pg}${boxes.length > 1 ? " ×" + boxes.length : ""}</button>`).join("")}</div>` : ""}
    ${reviewBar(r, idx)}
  </div>`;
}
const noteOf = (idx) => $("checks").querySelector(`input[data-note="${idx}"]`)?.value.trim();
$("checks").addEventListener("click", (e) => {
  const ok = e.target.closest("button[data-ok]"), loc = e.target.closest("button[data-loc]"), bl = e.target.closest("button[data-blind]");
  if (ok || loc || bl) {
    const idx = +(ok || loc || bl).dataset[ok ? "ok" : loc ? "loc" : "blind"], r = state.checks.rows[idx];
    if (bl) { const o = bl.dataset.o; saveReview(r, o === r.outcome ? "correct" : "wrong", o, noteOf(idx)); }
    else saveReview(r, ok ? "correct" : "wrong-location", r.outcome, noteOf(idx));
    return;
  }
  const b = e.target.closest("button[data-r]"); if (!b) return;
  const r = state.checks.rows[+b.dataset.r], pg = +b.dataset.p;
  if (!META.pages.some((p) => p.n === pg)) { alert(`Trang ${pg} không có trong lần xuất này.`); return; }
  showPage(pg, r.evidence.filter((ev) => ev.page === pg).map((ev) => ev.bbox));
});
$("checks").addEventListener("change", (e) => {
  const sel = e.target.closest("select[data-wrong]"); if (!sel || !sel.value) return;
  const idx = +sel.dataset.wrong; saveReview(state.checks.rows[idx], "wrong", sel.value, noteOf(idx));
});
(function loadChecks() {
  const s = document.createElement("script");
  s.src = "checks.js"; s.onerror = () => {};
  document.head.appendChild(s);
})();

// ---- tab Hồ sơ: đặc điểm hồ sơ, mục lục trang (khung tên + hình / bảng), bảng viết tắt ----
window.__ingestDossier = (data) => { state.dossier = data; renderDossier(); };
function renderDossier() {
  const d = state.dossier; if (!d) return;
  const pf = d.profile;
  const kv = (k, v) => `<tr><th>${k}</th><td>${esc(v == null || v === "" ? "—" : String(v))}</td></tr>`;
  const levels = Object.entries(pf.levels).map(([k, v]) => `${k} ${(v / 1000).toFixed(3)}`).join(" · ");
  $("dossierTab").textContent = `Hồ sơ (${d.sheets.filter((s) => s.name).length}/${d.sheets.length})`;
  $("dossier").innerHTML = `
    <p class="hint">Chỉ đọc từ bản vẽ (khung tên, tiêu đề, bảng viết tắt, cao độ) — chưa suy luận, chưa đối chiếu tiêu chí.</p>
    <h3>Đặc điểm hồ sơ</h3>
    <table>${kv("Hạng mục", pf.items.join(", "))}${kv("Công trình", pf.project)}${kv("Giai đoạn", pf.phase)}
      ${kv("Số trang", pf.page_count)}${kv("Các tầng", pf.storeys.join(", "))}${kv("Có hầm", pf.has_basement ? "có" : "không thấy")}
      ${kv("Có tum", pf.has_attic ? "có" : "không thấy")}${kv("Cao độ (m)", levels)}${kv("Tỉ lệ khung tên", pf.scales.join(", "))}
      ${pf.pages_without_title_block.length ? kv("Trang không đọc được khung tên", pf.pages_without_title_block.join(", ")) : ""}</table>
    <h3>Mục lục trang (${d.sheets.length})</h3>
    <table><tr><th>Tr.</th><th>Tên bản vẽ · hình / bảng trong trang</th><th>Tỉ lệ</th><th>Số hiệu</th></tr>
      ${d.sheets.map((s) => `<tr class="sh" data-n="${s.n}"><td>${s.n}</td><td><b>${esc(s.name || "—")}</b>
        ${s.views.length ? `<div class="vw">${s.views.map((v, i) => `<span data-n="${s.n}" data-v="${i}">${esc(v.title)}</span>`).join(" · ")}</div>` : ""}</td>
        <td>${esc(s.scale || "")}</td><td>${esc(s.number || "")}</td></tr>`).join("")}</table>
    <h3>Bảng viết tắt (${d.abbreviations.length})</h3>
    <table><tr><th>Viết tắt</th><th>Nghĩa</th><th>Tr.</th></tr>
      ${d.abbreviations.map((a, i) => `<tr class="sh" data-a="${i}"><td><b>${esc(a.abbr)}</b></td><td>${esc(a.meaning)}</td><td>${a.page}</td></tr>`).join("")}</table>`;
}
$("dossier").addEventListener("click", (e) => {
  const d = state.dossier; if (!d) return;
  const v = e.target.closest("span[data-v]"), row = e.target.closest("tr.sh");
  let pg = null, boxes = null;
  if (v) { const s = d.sheets.find((x) => x.n === +v.dataset.n); pg = s.n; boxes = [s.views[+v.dataset.v].bbox]; }
  else if (row?.dataset.a) { const a = d.abbreviations[+row.dataset.a]; pg = a.page; boxes = [a.bbox]; }
  else if (row?.dataset.n) pg = +row.dataset.n;
  if (pg == null) return;
  if (!META.pages.some((p) => p.n === pg)) { alert(`Trang ${pg} không có trong lần xuất này.`); return; }
  showPage(pg, boxes);
});
(function loadDossier() {
  const s = document.createElement("script");
  s.src = "dossier.js"; s.onerror = () => {};
  document.head.appendChild(s);
})();

// ---- khởi động ----
const who = META.reviewId ? `hồ sơ ${META.reviewId} · ${META.houseType || ""}` : (META.fileName || META.runId);
$("file").textContent = `${who} · ${META.pages.length}/${META.pageCount} trang · ${META.createdAt} · ${META.status} (${META.totalSeconds}s)`;
$("pageSel").innerHTML = META.pages.map((p) => `<option value="${p.n}">Trang ${p.n}</option>`).join("");
$("pages").innerHTML = META.pages.map((p) => `
  <div class="pg" data-n="${p.n}">
    <b>Trang ${p.n}</b>
    <div class="t" title="${esc(p.title)}">${esc(p.title) || "—"}</div>
    <div class="c">${p.texts.toLocaleString("vi-VN")} chữ · ${p.paths.toLocaleString("vi-VN")} nét · ${p.layers} layer</div>
  </div>`).join("");
$("pages").addEventListener("click", (e) => { const el = e.target.closest(".pg"); if (el) showPage(+el.dataset.n); });
new ResizeObserver(resize).observe(stage);
let start = META.pages[0].n;
try { const saved = +localStorage.getItem("ingest.page." + META.runId); if (META.pages.some((p) => p.n === saved)) start = saved; } catch (e) {}
const fromHash = +(location.hash.match(/p=(\d+)/) || [])[1];
if (META.pages.some((p) => p.n === fromHash)) start = fromHash;
if (/tab=checks/.test(location.hash)) setTab("checks");
if (/tab=dossier/.test(location.hash)) setTab("dossier");
showPage(start);
</script>
</body>
</html>
