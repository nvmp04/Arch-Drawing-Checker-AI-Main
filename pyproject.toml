[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arch-drawing-checker-main"
version = "0.0.1"
description = "MAIN — lõi AI phân tích bản vẽ kiến trúc (PDF vector) đối chiếu tiêu chí CHTK"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "anthropic>=1.12",
  "psycopg[binary]>=3.2",  # lưu kết quả chấm vào Neon Postgres khi chạy trên Render (D-24)  # Claude API (D-22) — chỉ dùng khi MAIN_AI_PROVIDER=claude
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drawing_checker = ["**/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
